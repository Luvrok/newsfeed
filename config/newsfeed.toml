# Google News is a free official aggregator: one feed covers hundreds of
# outlets. The article links point at Google's redirector.
# Reuters has no free official feed any more. Google News indexes the site
# for free and gives one stable RSS endpoint; links open the original article.
[[sources]]
id = "reuters"
kind = "rss"
label = "Reuters"
site = "https://www.reuters.com"
group = "world"
interval = "15m"
[sources.options]
url = "https://news.google.com/rss/search?q=site:reuters.com&hl=en-US&gl=US&ceid=US:en"
limit = 25
summary = false

[[sources]]
id = "google-news"
kind = "rss"
label = "Google News"
site = "https://news.google.com"
group = "world"
interval = "10m"
[sources.options]
url = "https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en"
limit = 40
summary = false

