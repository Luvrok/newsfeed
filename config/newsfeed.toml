# newsfeed — development settings
#
# Global settings only. The subscription catalogue lives in config/seed.toml
# and is applied on every start, inserting only the rows that are missing.
# After that the SQLite table is the source of truth: add, edit, pause and
# delete sources in /manage.

[server]
addr = "127.0.0.1:8787"
web_dir = "web/dist"
image_cache = "data/images"
# "*" opens CORS to every origin; empty allows only localhost dev ports.
allowed_origin = ""

[database]
path = "data/newsfeed.db"
seed_file = "config/seed.toml"

[fetch]
timeout = "40s"
workers = 8
max_items = 300      # hard cap per source per poll
retention_days = 30  # older items are pruned every 6 hours
user_agent = "newsfeed/0.1 (+https://github.com/barnard/newsfeed)"
# Global proxy for every source, e.g. "socks5://127.0.0.1:1080" or
# "http://127.0.0.1:8080". Empty means the process environment
# (HTTP_PROXY / HTTPS_PROXY) or a direct connection, in that order.
proxy = ""
# Set true only when sources point at a local service such as RSSHub.
allow_private_networks = false
