# ---------------------------------------------------------------------------
# Official feeds — government and platform APIs
# ---------------------------------------------------------------------------

# Reddit needs a free "script" app: reddit.com/prefs/apps. Put its id and
# secret in REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET (or in the options) and
# flip enabled to true. Official OAuth API, no scraping.
[[sources]]
id = "reddit"
kind = "reddit"
label = "Reddit"
site = "https://www.reddit.com"
group = "social"
interval = "15m"
enabled = false
[sources.options]
subreddits = ["golang", "nixos", "worldnews"]
sort = "hot"
limit = 25
# client_id = "..."
# client_secret = "..."

[[sources]]
id = "usgs-quakes"
kind = "usgs"
label = "USGS Earthquakes"
site = "https://earthquake.usgs.gov"
group = "official"
interval = "5m"
[sources.options]
feed = "4.5"
period = "day"
limit = 20

# GDELT indexes thousands of outlets and needs no key, but it rate-limits
# hard: one request per five seconds per IP. It is left off by default.
[[sources]]
id = "gdelt-world"
kind = "gdelt"
label = "GDELT"
site = "https://www.gdeltproject.org"
group = "world"
interval = "15m"
enabled = false
[sources.options]
query = "climate OR election OR conflict"
timespan = "1d"
max = 40
