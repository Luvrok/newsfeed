# newsfeed — source subscriptions
#
# Every [[sources]] block is one subscription. Its kind decides which
# fetcher handles it; the options table is passed to that fetcher as is.
# Add a source by copying a block: no code, no restart of anything but
# the service. Disable one with `enabled = false`.

[server]
addr = "127.0.0.1:8787"
web_dir = "web/dist"
image_cache = "data/images"
# "*" opens CORS to every origin; empty allows only localhost dev ports.
allowed_origin = ""

[database]
path = "data/newsfeed.db"

[fetch]
timeout = "40s"
workers = 8
max_items = 300      # hard cap per source per poll
retention_days = 30  # older items are pruned every 6 hours
user_agent = "newsfeed/0.1 (+https://github.com/barnard/newsfeed)"
# Global proxy for every source, e.g. "socks5://127.0.0.1:1080" or
# "http://127.0.0.1:8080". Empty means the process environment
# (HTTP_PROXY / HTTPS_PROXY) or a direct connection, in that order.
proxy = ""

# ---------------------------------------------------------------------------
# World news — RSS
# ---------------------------------------------------------------------------

[[sources]]
id = "bbc-world"
kind = "rss"
label = "BBC World"
site = "https://www.bbc.com/news/world"
group = "world"
interval = "10m"
[sources.options]
url = "https://feeds.bbci.co.uk/news/world/rss.xml"
limit = 25

