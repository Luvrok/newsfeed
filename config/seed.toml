# The default subscription catalogue.
#
# It starts as the Miniflux list and adds the general feeds the project ships
# with: agencies, tech, Mastodon tags and official APIs. The file is applied on
# every start, but only inserts rows that are missing: an existing source is
# never overwritten, a paused one stays paused, and a deleted one stays
# deleted. After the first run the SQLite table is the source of truth, so edit
# sources in /manage rather than here.

# ---------------------------------------------------------------------------
# Breaking
# ---------------------------------------------------------------------------

[[sources]]
id = "meduza"
kind = "rss"
label = "Meduza"
site = "https://meduza.io"
group = "Breaking"
interval = "10m"
[sources.options]
url = "https://meduza.io/rss/all"
limit = 25
include = "^https://meduza\\\\.io/news/"

[[sources]]
id = "tg-ateo"
kind = "telegram"
label = "Ateo Breaking"
site = "https://t.me/ateobreaking"
group = "Breaking"
interval = "5m"
[sources.options]
channels = ["ateobreaking"]
limit = 20
skip = ["спонсор показа", "Durev VPN", "erid"]

